_schema-version: "3.1"
ID: mfw-wm-suite
version: 1.0.0
description: MFW Warehouse Management Suite - Entradas, Salidas, Inventario, Traspasos, Utilidades

parameters:
  enable-parallel-deployments: true

modules:
  # CAP service: OData V4 services + static UI (app/).
  # PoC: in-memory SQLite seeded from db/data/*.csv on every start (see package.json [production]).
  - name: mfw-wm-srv
    type: nodejs
    path: .
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules/
        - approuter/
        - mta_archives/
        - .mta/
        - gen/
        - db.sqlite
        - "*.mtar"
        - "*.log"
        - "*.tar.gz"
        - .DS_Store
        - "**/.DS_Store"
        - "Makefile*.mta"
        - .env
        - mta.yaml
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
      instances: 1
    requires:
      - name: mfw-xsuaa
      - name: mfw-destinations
      - name: mfw-logging
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # Approuter: entry point for users; handles XSUAA login and forwards the JWT to the CAP service
  - name: mfw-wm-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules/
    parameters:
      memory: 256M
      disk-quota: 512M
      instances: 1
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: mfw-xsuaa

resources:
  # XSUAA (Authentication & Authorization) - scopes, roles and role collections in xs-security.json
  - name: mfw-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: mfw-wm-${space}
        tenant-mode: dedicated

  # Destination Service (for S/4HANA connectivity)
  - name: mfw-destinations
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # Application Logging Service
  - name: mfw-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
